<header>
    <div class="title">
        <div></div>
        <h1>ADD DOCUMENTS</h1>
        <div class="titleRightPart">
            <h4>User connected :</h4>
            <h4>&nbsp;{{ currentUser }}</h4>
        </div>
    </div>
    <div class="head-grid">
        <div class="button-container">
            <button (click)="navigateToHomepage()">ADD DOCUMENTS</button>
            <button (click)="navigateToVisualiseData()">YOUR DOCUMENTS</button>
            <button (click)="navigateToVisualizeSharedData()">DOCUMENTS SHARED WITH YOU</button>
            <button (click)="navigateToShareData()">SHARE YOUR DATA</button>
            <button (click)="navigateToLogin()">Sign Out</button>
        </div>
    </div>
</header>

<div class="page">
    <div class="fields">
        <div class="fieldsContain">
            <div class="addTextOrDocument">
                <h1>Encrypt a Text</h1>
                <input type="text" [(ngModel)]="textName" placeholder="Title of your text">
                <textarea [(ngModel)]="textTapped" placeholder="Enter your text" rows="8" cols="50"></textarea>
                <h3 *ngIf="errorMessageText"> {{ errorMessageText }} </h3>
                <button (click)="onSelectedDataText()">Encrypt Text</button>
            </div>
            <div class="addTextOrDocument">
                <h1>Upload a Document</h1>
                <p>Autorised types : .mp4, .txt, .pdf, .png, .jpeg, .jpg, .xls, .xlsx</p>
                <input type="file" (change)="onFileSelected($event)" accept="video/*, .txt, .pdf, .png, .jpeg, .jpg, .xls, .xlsx" />
                <h3 *ngIf="errorMessageFile"> {{ errorMessageFile }} </h3>
                <h5 *ngIf="waitingMessage">{{waitingMessage}}</h5>
            </div>
        </div>
    </div>
</div>
